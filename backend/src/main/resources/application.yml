spring:
  application:
    name: smart-banking-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartbanking}
    username: ${DB_USERNAME:smartbanking}
    password: ${DB_PASSWORD:}
  jpa:
    # Flyway owns the schema; Hibernate never creates or alters tables.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    # Required: at least 32 characters. Supply via the JWT_SECRET environment variable.
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: smart-banking-simulator
    token-ttl: 30m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  fraud:
    # Illustrative demo settings only - these are not real-world fraud thresholds.
    high-value:
      enabled: true
      thresholds:
        EUR: 2000.00
        PLN: 8500.00
        USD: 2200.00
    repeated-transfers:
      enabled: true
      max-transfers: 5
      window: 2m
    velocity:
      enabled: true
      window: 60m
      limits:
        EUR: 5000.00
        PLN: 21000.00
        USD: 5500.00

logging:
  level:
    com.smartbanking: INFO
