# Local demo environment. The credentials below are for local development only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartbanking
      POSTGRES_USER: smartbanking
      POSTGRES_PASSWORD: smartbanking
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbanking -d smartbanking"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/smartbanking
      DB_USERNAME: smartbanking
      DB_PASSWORD: smartbanking
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
